run_id: turbovla_clean50_smoke_20260927_a
run_root_dir: /data/jack/robotwin2_turbovla/runs
seed: 42
wandb_entity: your_wandb_entity
wandb_project: turbovla_robotwin
is_debug: false
version_id: '0.1'
framework:
  name: TurboVLA
  text:
    bert_path: /home/jack/TurboVLA/pretrained/backbones/bert-base-uncased
    max_text_len: 256
    sub_sentence_present: true
    local_files_only: true
    freeze_text_encoder: true
    attn_implementation: flash_attention_2
  vision:
    model_path: /home/jack/TurboVLA/pretrained/backbones/dinov3-vitl16
    image_size: 224
    num_views: 3
    local_files_only: true
    freeze_vision_encoder: false
    attn_implementation: flash_attention_2
    position_init_std: 0.01
    position_scale_init: 0.01
    dropout: 0.1
  interaction:
    hidden_dim: 256
    nheads: 8
    dim_feedforward: 2048
    enhancer_inner_dim: 1024
    num_layers: 6
    text_dropout: 0.0
    fusion_dropout: 0.0
    fusion_droppath: 0.1
    padding_strategy: zero_fill
    residual_style: pre_norm
    attention_backend: sdpa
    compute_precision: bf16_autocast
  initialization:
    pretrained_ckpt: /home/jack/TurboVLA/pretrained/backbones/groundingdino/groundingdino_swint_ogc.pth
    load_pretrained: true
    load_bert: true
    load_text_projection: true
    load_interaction: true
  action:
    action_dim: 14
    state_dim: 14
    horizon: 50
    num_layers: 3
    num_state_tokens: 2
    state_hidden_dim: 256
    mlp_hidden_dim: 512
    dropout: 0.1
    loss_type: l1
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /home/jack/datasets/RoboTwin
    data_mix: robotwin_clean_50
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 6
    load_all_data_for_training: true
    obs_image_size:
    - 224
    - 224
    video_backend: pyav
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
trainer:
  use_deepspeed: true
  max_train_steps: 20
  num_warmup_steps: 5
  save_interval: 20
  eval_interval: 10
  learning_rate:
    base: 5.0e-05
    text_encoder: 5.0e-05
    vision_encoder: 5.0e-05
    vision_language_interaction: 5.0e-05
    vision_projection: 5.0e-05
    action_head: 5.0e-05
  lr_scheduler_type: warmup_constant_with_factor
  scheduler_specific_kwargs:
    warmup_start_factor: 0.0
  freeze_modules: model.text_encoder.bert
  max_grad_norm: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 16
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-10
  save_format: safetensors
  ema_decay: 0.999
  ema_device: cuda
  logging_frequency: 1
config_yaml: experiments/robotwin/configs/clean50.yaml
output_dir: /data/jack/robotwin2_turbovla/runs/turbovla_clean50_smoke_20260927_a
